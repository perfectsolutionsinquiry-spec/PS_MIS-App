<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Perfect Solutions Docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
/* ── Design tokens ──────────────────────────────────────────────────
   Reuses the live product's own palette (docs/TECHNICAL_DOCUMENTATION.md
   and docs/FUNCTIONAL_GUIDE.md describe the app these pages document —
   the doc site is skinned to match it, not invented fresh) and its real
   brand font (IBM Plex Sans), paired with IBM Plex Mono — same type
   family, used only for the things that are actually code-shaped here:
   file paths, route names, SQL, function names. */
:root {
  --ink: #0f172a;
  --ink-soft: #334155;
  --muted: #64748b;
  --accent: #2563eb;
  --accent-soft: #eff6ff;
  --surface: #ffffff;
  --ground: #f8fafc;
  --border: #e2e8f0;
  --code-bg: #f1f5f9;
  --good: #15803d;
  --font-sans: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e2e8f0;
    --ink-soft: #cbd5e1;
    --muted: #94a3b8;
    --accent: #60a5fa;
    --accent-soft: #16233b;
    --surface: #0f172a;
    --ground: #0a0f1a;
    --border: #1e293b;
    --code-bg: #111c30;
    --good: #4ade80;
  }
}
:root[data-theme="dark"] {
  --ink: #e2e8f0;
  --ink-soft: #cbd5e1;
  --muted: #94a3b8;
  --accent: #60a5fa;
  --accent-soft: #16233b;
  --surface: #0f172a;
  --ground: #0a0f1a;
  --border: #1e293b;
  --code-bg: #111c30;
  --good: #4ade80;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--font-mono); }
h1, h2, h3 { text-wrap: balance; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { display: flex; min-height: 100vh; }

/* ── Left nav: category > article tree ─────────────────────────── */
.nav {
  width: 272px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  background: var(--surface);
  padding: 1.25rem 1rem;
  height: 100vh;
  position: sticky;
  top: 0;
  overflow-y: auto;
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0 0.25rem 1.1rem;
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}
.nav-brand-mark {
  width: 26px; height: 26px; border-radius: 6px;
  background: var(--accent); flex-shrink: 0;
}
.nav-brand-text { font-weight: 700; font-size: 0.92rem; }
.nav-brand-sub { font-size: 0.7rem; color: var(--muted); margin-top: 0.1rem; }
.nav-category { margin-bottom: 1.4rem; }
.nav-category-label {
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--muted); padding: 0 0.6rem;
  margin-bottom: 0.4rem;
}
.nav-link {
  display: block; padding: 0.4rem 0.6rem; border-radius: 6px;
  font-size: 0.85rem; color: var(--ink-soft);
}
.nav-link:hover { background: var(--ground); text-decoration: none; }
.nav-link.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* ── Main column ────────────────────────────────────────────────── */
.main { flex: 1; min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0.9rem 2rem;
}
.search-wrap { max-width: 640px; position: relative; }
.search-input {
  width: 100%; font: inherit; font-size: 0.92rem;
  padding: 0.6rem 1rem 0.6rem 2.4rem; border-radius: 999px;
  border: 1px solid var(--border); background: var(--ground); color: var(--ink);
}
.search-input:focus { outline: none; border-color: var(--accent); }
.search-icon { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

.content { max-width: 760px; margin: 0 auto; padding: 2.25rem 2rem 5rem; }

.breadcrumb { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.6rem; }
.breadcrumb .sep { margin: 0 0.35rem; }
article h1 { font-size: 1.55rem; font-weight: 700; margin: 0 0 0.3rem; }
.article-meta { font-size: 0.78rem; color: var(--muted); margin-bottom: 1.6rem; }
article h2 { font-size: 1.1rem; font-weight: 700; margin: 2rem 0 0.75rem; padding-top: 0.5rem; border-top: 1px solid var(--border); }
article h2:first-of-type { border-top: none; padding-top: 0; margin-top: 1rem; }
article h3 { font-size: 0.95rem; font-weight: 600; margin: 1.4rem 0 0.5rem; }
article p { margin: 0 0 1rem; color: var(--ink-soft); max-width: 66ch; }
article ul, article ol { margin: 0 0 1rem; padding-left: 1.3rem; color: var(--ink-soft); max-width: 66ch; }
article li { margin-bottom: 0.35rem; }
article strong { color: var(--ink); }

.table-wrap { overflow-x: auto; margin: 0 0 1.4rem; border: 1px solid var(--border); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th { text-align: left; background: var(--ground); color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; padding: 0.6rem 0.85rem; border-bottom: 1px solid var(--border); }
td { padding: 0.6rem 0.85rem; border-bottom: 1px solid var(--border); color: var(--ink-soft); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td code, th code { font-size: 0.82em; }

code {
  background: var(--code-bg); color: var(--ink); border-radius: 4px;
  padding: 0.1em 0.4em; font-size: 0.87em;
}
pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 1rem 1.1rem; overflow-x: auto; margin: 0 0 1.4rem; font-size: 0.8rem;
}
pre code { background: none; padding: 0; }
pre.mermaid { font-family: var(--font-mono); color: var(--ink-soft); white-space: pre; }

.callout {
  border-left: 3px solid var(--accent); background: var(--accent-soft);
  border-radius: 0 8px 8px 0; padding: 0.85rem 1.1rem; margin: 0 0 1.4rem;
  font-size: 0.87rem; color: var(--ink-soft);
}
.callout strong { color: var(--ink); }

/* ── Search results ─────────────────────────────────────────────── */
.results-count { font-size: 0.82rem; color: var(--muted); margin-bottom: 1.2rem; }
.result-card {
  display: block; padding: 1rem 1.1rem; border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 0.85rem; background: var(--surface);
}
.result-card:hover { border-color: var(--accent); text-decoration: none; }
.result-title { font-size: 0.98rem; font-weight: 600; color: var(--accent); margin-bottom: 0.2rem; }
.result-crumb { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.4rem; }
.result-snippet { font-size: 0.85rem; color: var(--ink-soft); }
.result-snippet mark { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 0.15em; }
.empty-state { color: var(--muted); font-size: 0.9rem; padding: 2rem 0; }

@media (max-width: 860px) {
  .nav { position: fixed; left: -272px; transition: left 0.15s ease; z-index: 20; box-shadow: 0 0 0 100vmax rgba(0,0,0,0); }
  .nav.open { left: 0; box-shadow: 4px 0 24px rgba(15,23,42,0.25); }
  .menu-btn { display: inline-flex !important; }
  .content { padding: 1.5rem 1.1rem 4rem; }
  .topbar { padding: 0.8rem 1.1rem; }
}
.menu-btn {
  display: none; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink); margin-right: 0.6rem; cursor: pointer; flex-shrink: 0;
}
</style>
</head>

<div class="shell">

  <nav class="nav" id="nav">
    <div class="nav-brand">

        <button class="menu-btn" id="menuBtn" title="Menu" aria-label="Toggle navigation">☰</button>
        <div style="position:relative; flex:1;">
          <span class="search-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          </span>

</div>

<script>
// ── Content ────────────────────────────────────────────────────────
// Two categories, mirroring docs/TECHNICAL_DOCUMENTATION.md and

// updated in the same commit as any code change per CLAUDE.md's
// "Documentation practice" section); this page is a browsable,
// searchable rendering of the same content; keep both in sync by hand
// when either changes.
const CATEGORIES = [
  {
    id: "technical",
    label: "Technical Documentation",
    articles: [
      { id: "architecture", title: "Architecture at a glance", html: `
        <p>The one rule everything else follows: <strong>the API decides, the frontend displays.</strong> No business number is computed in <code>apps/web</code>, and no access decision is made there either — every route re-derives who's asking from the verified Clerk token, never from anything the client claims.</p>
        <pre class="mermaid">flowchart LR
    subgraph Browser
        FE["apps/web — Vite + React<br/>(Sidebar / Overview / Customers / CustomerDetail)"]
    end
    subgraph Render
        API["apps/api — Fastify<br/>(auth.ts, index.ts)"]
    end
    subgraph Clerk
        CL["Clerk — who is this person?"]
    end
    subgraph Neon
        DB[("Postgres — the data,<br/>row-level security enforced")]
    end

    FE -- "Bearer token from useAuth().getToken()" --> API
    API -- "verifyToken()" --> CL
    API -- "set_config(app.is_staff / app.current_builder_id)<br/>then the real query, same transaction" --> DB
    DB -- rows, already tenant-filtered --> API
    API -- "JSON the frontend only displays" --> FE</pre>
        <div class="callout"><strong>Stack:</strong> <code>apps/api</code> is Fastify + TypeScript on Render, talking to Postgres via <code>pg</code>. <code>apps/web</code> is Vite + React, using Clerk's prebuilt <code>&lt;SignIn/&gt;</code> and a Bearer token from <code>useAuth().getToken()</code> on every fetch.</div>
      `},
      { id: "schema", title: "Database schema map", html: `
        <p>13 tables (<code>db/migrations/0001_init.sql</code>). Every tenant-scoped table carries <code>builder_id</code> directly, even where it could be derived through a join, so the same row-level-security rule applies everywhere without tracing through multiple tables.</p>
        <h3>Entity relationships</h3>
        <pre class="mermaid">erDiagram
    builders ||--o{ builder_users : "has logins"
    builders ||--o{ bank_accounts : owns
    builders ||--o{ projects : owns
    builders ||--o{ customers : "has customers"
    projects ||--o{ towers : contains
    towers ||--o{ payment_milestones : "schedule template"
    towers ||--o{ inventory_units : contains
    inventory_units ||--o| customers : "sold to (nullable)"
    banks ||--o{ customers : "financing bank (nullable)"
    customers ||--o{ co_applicants : has
    customers ||--o{ customer_milestones : "owes on"
    payment_milestones ||--o{ customer_milestones : "generates one row per customer"
    customers ||--o{ recovery_transactions : "pays via"
    staff_users ||--o{ customers : "assigned to (nullable)"</pre>
        <h3>Table by table</h3>
        <div class="table-wrap"><table>
          <tr><th>Table</th><th>What it holds</th><th>RLS?</th></tr>
          <tr><td><code>banks</code></td><td>Financing banks a loan can be against. Shared across every builder.</td><td>No — shared reference data</td></tr>
          <tr><td><code>staff_users</code></td><td>Perfect Solutions' own employees. See every builder's data.</td><td>No — only reached by staff-gated code</td></tr>

          <tr><td><code>builder_users</code></td><td>A builder's own admin/CRM logins.</td><td><strong>No, deliberately</strong> — see below</td></tr>
          <tr><td><code>bank_accounts</code></td><td>A builder's own bank accounts.</td><td>Yes</td></tr>
          <tr><td><code>projects</code></td><td>A builder's real-estate project (e.g. "Aarambh").</td><td>Yes</td></tr>
          <tr><td><code>towers</code></td><td>One tower/building within a project.</td><td>Yes</td></tr>
          <tr><td><code>payment_milestones</code></td><td>The payment-schedule <em>template</em> for a tower.</td><td>Yes</td></tr>
          <tr><td><code>inventory_units</code></td><td>One flat/unit in a tower.</td><td>Yes</td></tr>
          <tr><td><code>customers</code></td><td>The buyer — booking/agreement/loan/GST facts. ~35 columns.</td><td>Yes</td></tr>
          <tr><td><code>co_applicants</code></td><td>A customer's co-applicant(s).</td><td>Yes</td></tr>
          <tr><td><code>customer_milestones</code></td><td>One row per customer per milestone — due/paid status.</td><td>Yes</td></tr>
          <tr><td><code>recovery_transactions</code></td><td>The payment ledger. Insert-only.</td><td>Yes</td></tr>
          <tr><td><code>app_settings</code></td><td><em>(0004)</em> Generic key/value platform config — starts with <code>customer_highlight_fields</code>.</td><td>No — app-wide config</td></tr>
        </table></div>
        <div class="callout"><strong>0004 is a manual step</strong>, same as 0001-0003 — written and committed, but only takes effect once actually run against Neon. Also adds <code>customers.is_active</code> (the soft-delete field — Delete sets this false, never removes the row). Until the migration runs, <code>DELETE /customers/:id</code> and the highlight-fields settings routes aren't deployed.</div>
        <h3>Row-level security, in one paragraph</h3>
        <p>Every RLS table has one policy: <code>is_staff OR builder_id = current_builder_id</code>, <strong>forced</strong> (binds even to the table's owning DB role). The API sets <code>app.is_staff</code> / <code>app.current_builder_id</code> per request from the verified Clerk identity — never from the client. <code>builder_users</code> has RLS off on purpose: the query that discovers which builder a login belongs to must run before any tenant context exists.</p>
        <div class="callout"><strong>Deliberately not in the schema:</strong> spreadsheet formula/derived columns (Basic Value formula, Agreement Value formula, per-stage percentages). Those belong in a future <code>packages/calc-engine</code>, computed from the raw inputs — storing the same fact twice is the bug class this avoids.</div>
      `},
      { id: "flows", title: "How data actually flows", html: `
        <h3>Login → identity → tenant-scoped query</h3>
        <pre class="mermaid">sequenceDiagram
    participant U as User's browser
    participant C as Clerk
    participant A as API (auth.ts)
    participant D as Postgres

    U->>C: sign in
    C-->>U: session token
    U->>A: any request, Authorization: Bearer <token>
    A->>C: verifyToken()
    C-->>A: clerkUserId
    A->>D: select from staff_users / builder_users where clerk_user_id = ?
    D-->>A: identity (staff, or builder + builderId)
    A->>D: begin; set_config(app.is_staff / app.current_builder_id)
    A->>D: the actual query (same transaction)
    D-->>A: rows, already filtered by RLS
    A->>D: commit
    A-->>U: JSON</pre>
        <p>Where this lives: <code>requireAuth</code> and <code>withTenantClient</code>, both in <code>apps/api/src/auth.ts</code>. The <code>begin</code>/<code>commit</code> wrapping matters — see the file's own comment for the real bug it fixed.</p>
        <h3>Opening a customer's record</h3>
        <pre class="mermaid">sequenceDiagram
    participant FE as CustomerDetailScreen.tsx
    participant API as GET /customers/:id
    participant DB as Postgres

    FE->>API: fetch, with the customer id
    API->>DB: customers row + bank name (one query)
    API->>DB: co_applicants, recovery_transactions, customer_milestones (parallel)
    DB-->>API: all four result sets
    API->>API: parse every numeric/date column once
    API->>API: compute totals — totalReceived, amountDue, balance
    API-->>FE: { customer, coApplicants, payments, milestones, totals }</pre>
        <p>A missing id and an id belonging to another builder both come back as the same 404 — telling them apart would leak whether an id exists on another tenant's data.</p>
        <h3>Recording a payment</h3>
        <pre class="mermaid">sequenceDiagram
    participant FE as CustomerDetailScreen.tsx
    participant API as POST /customers/:id/payments
    participant DB as Postgres

    FE->>API: { received_on, flat_cost_received, gst_received, remark, source }
    API->>API: validate: date required, amount > 0
    API->>DB: insert into recovery_transactions<br/>select builder_id from customers where id = ? (RLS-scoped)
    DB-->>API: new row id (or zero rows if the customer id wasn't theirs)
    API-->>FE: { ok, id }</pre>
        <p>Insert-only, on purpose — a financial record is never edited or deleted, only reversed with a new entry (the reversal flow itself isn't built yet). <code>builder_id</code> is derived from the customer row itself, never trusted from the client.</p>
      `},
      { id: "routes", title: "API route reference", html: `

        <div class="table-wrap"><table>
          <tr><th>Method &amp; path</th><th>What it does</th><th>RLS</th></tr>

          <tr><td><code>GET /db-check</code></td><td>Confirms the API can reach Postgres.</td><td>—</td></tr>

      `},
      { id: "frontend-index", title: "Frontend file-by-file index", html: `

// ── Plumbing ──────────────────────────────────────────────────────
const allArticles = CATEGORIES.flatMap(cat =>
  cat.articles.map(a => ({ ...a, categoryId: cat.id, categoryLabel: cat.label }))
);
const contentEl = document.getElementById("content");
const navTreeEl = document.getElementById("nav-tree");
const searchInput = document.getElementById("searchInput");

function stripHtml(html) {
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  return (tmp.textContent || "").replace(/\s+/g, " ").trim();
}

function renderNav(activeId) {
  navTreeEl.innerHTML = CATEGORIES.map(cat => `
    <div class="nav-category">
      <div class="nav-category-label">${cat.label}</div>
      ${cat.articles.map(a => `<a class="nav-link${a.id === activeId ? " active" : ""}" href="#${a.id}">${a.title}</a>`).join("")}
    </div>
  `).join("");
}

function renderArticle(id) {
  const article = allArticles.find(a => a.id === id) || allArticles[0];
  renderNav(article.id);
  contentEl.innerHTML = `
    <div class="breadcrumb">${article.categoryLabel}<span class="sep">/</span>${article.title}</div>
    <article>
      <h1>${article.title}</h1>
      ${article.html}
    </article>
  `;
  if (window.mermaid) window.mermaid.run({ querySelector: ".mermaid" });
  window.scrollTo(0, 0);
}

function renderSearch(query) {
  navTreeEl.querySelectorAll(".nav-link").forEach(el => el.classList.remove("active"));
  const q = query.trim().toLowerCase();
  const results = allArticles
    .map(a => {
      const text = stripHtml(a.html);
      const hay = (a.title + " " + text).toLowerCase();
      const idx = hay.indexOf(q);
      return idx === -1 ? null : { ...a, idx, text };
    })
    .filter(Boolean);

  if (results.length === 0) {
    contentEl.innerHTML = `
      <div class="breadcrumb">Search results</div>
      <h1 style="font-size:1.3rem;">Nothing found for “${query}”</h1>
      <div class="empty-state">Try a different term — e.g. a business word like “collection efficiency” or a technical one like “RLS” or a file name like “DataTable”.</div>
    `;
    return;
  }

  contentEl.innerHTML = `
    <div class="breadcrumb">Search results</div>
    <h1 style="font-size:1.3rem;">Results for “${query}”</h1>
    <div class="results-count">${results.length} article${results.length === 1 ? "" : "s"} match</div>
    ${results.map(r => {
      const snippetStart = Math.max(0, r.idx - 60);
      let snippet = r.text.slice(snippetStart, r.idx + q.length + 80);
      if (snippetStart > 0) snippet = "…" + snippet;
      if (snippetStart + snippet.length < r.text.length) snippet += "…";
      const escaped = snippet.replace(/</g, "&lt;");
      const highlighted = escaped.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig"), (m) => `<mark>${m}</mark>`);
      return `
        <a class="result-card" href="#${r.id}">
          <div class="result-crumb">${r.categoryLabel}</div>
          <div class="result-title">${r.title}</div>
          <div class="result-snippet">${highlighted}</div>
        </a>
      `;
    }).join("")}
  `;
  window.scrollTo(0, 0);
}

function route() {
  const hash = decodeURIComponent(location.hash.slice(1));
  if (searchInput.value.trim()) return; // an active search owns the content pane until cleared
  renderArticle(hash || allArticles[0].id);
}

searchInput.addEventListener("input", () => {
  const q = searchInput.value;
  if (q.trim()) {
    history.replaceState(null, "", "#");
    renderSearch(q);
  } else {
    route();
  }
});

window.addEventListener("hashchange", () => {
  if (!searchInput.value.trim()) route();
});

const menuBtn = document.getElementById("menuBtn");
const navEl = document.getElementById("nav");
menuBtn.addEventListener("click", () => navEl.classList.toggle("open"));
navTreeEl.addEventListener("click", (e) => {
  if (e.target.closest("a")) navEl.classList.remove("open");
});

route();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, theme: "neutral", securityLevel: "loose" });
    mermaid.run({ querySelector: ".mermaid" });
  }
</script>
