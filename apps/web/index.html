<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfect Solutions</title>
    <!-- The icon-only mark from Perfect Solutions' real brand assets
         (apps/web/public/favicon.png — cropped square, transparent bg).
         PNG favicons are supported by every current browser, so there's no
         need to also ship a low-res .ico. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Perfect Solutions' actual brand typeface — IBM Plex Sans, one of
         the two families the real brochure is set in (see
         apps/web/src/index.css). Only Sans is loaded: the brochure pairs
         it with IBM Plex Serif for body copy/figures, this app tried that
         on its KPI figures and the user preferred Sans there too, so
         there's currently no serif use anywhere on the page — no point
         loading a font family nothing renders with. Loaded from Google
         Fonts rather than a self-hosted .ttf — the exact same open-source
         (SIL OFL) file Google serves, and there's no local build step in
         this project to run a font-subsetting step against a bundled
         file. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
