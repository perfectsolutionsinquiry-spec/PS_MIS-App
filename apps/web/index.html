<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfect Solutions</title>
    <!-- The icon-only mark from Perfect Solutions' real brand assets
         (apps/web/public/favicon.png — cropped square, transparent bg).
         PNG favicons are supported by every current browser, so there's no
         need to also ship a low-res .ico. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Perfect Solutions' actual brand typefaces (same two families the
         real brochure is set in — see apps/web/src/index.css for how
         they're assigned, and PerfectSolutions_Brochure_Fonts' own
         INSTALL_README.txt for the brochure's original Sans=titles/
         Serif=body-and-values split this follows). Loaded from Google
         Fonts rather than self-hosted .ttf files — both are the exact
         same open-source (SIL OFL) files Google serves, and there's no
         local build step in this project to run a font-subsetting step
         against bundled files. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
